{% extends "base.html" %}

{% block conteudo %}

<h2>Livros</h2>

<form action="/livros/cadastrar" method="POST">

    <input
        type="text"
        name="titulo"
        placeholder="Título do livro"
        required
    >

    <input
        type="number"
        name="ano"
        placeholder="Ano"
    >

    <select name="id_autor" required>

        <option value="">Selecione o autor</option>

        {% for autor in autores %}
            <option value="{{ autor.id_autor }}">
                {{ autor.nome }}
            </option>
        {% endfor %}

    </select>

    <button type="submit">Cadastrar</button>

</form>

<table>

    <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Ano</th>
        <th>Autor</th>
        <th>Ação</th>
    </tr>

    {% for livro in livros %}

    <tr>

        <td>{{ livro.id_livro }}</td>
        <td>{{ livro.titulo }}</td>
        <td>{{ livro.ano }}</td>
        <td>{{ livro.autor }}</td>

        <td>
            <a href="/livros/excluir/{{ livro.id_livro }}">
                Excluir
            </a>
        </td>

    </tr>

    {% endfor %}

</table>

{% endblock %}
